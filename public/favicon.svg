<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Rounded Brand Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none" />

  <!-- Monogram "B" and Brain Buzz Spark -->
  <g filter="url(#glow)">
    <!-- Stylized "B" spine and loops -->
    <path d="M20 16 H33 C39 16 43 19 43 24 C43 27.5 40.5 30.5 37 31.5 C41.5 32.5 45 36 45 41 C45 47 40 50 33 50 H20 V16 Z M26 22 V30 H32.5 C35 30 37 28.5 37 26 C37 23.5 35 22 32.5 22 H26 Z M26 35 V44 H33.5 C36.5 44 38.5 42 38.5 39.5 C38.5 37 36.5 35 33.5 35 H26 Z" fill="#ffffff" />
    <!-- Dynamic Lightning / Spark Icon on top right -->
    <path d="M42 12 L38 20 H44 L39 29 L47 19 H41 L45 12 Z" fill="url(#sparkGrad)" />
  </g>
</svg>
